# Portable release configuration: all editable tool settings in one file.
defaults:
  input_folder: ''
  output_folder: ''
  template_folder: template
  default_template_library: template
logging:
  mode: online
  sharepoint_site_url: https://faurecia.sharepoint.com/sites/AIPortal
  list_name: ToolUseLogs
  tool_name: Testing Data Consolidation Tool
  excel_bridge_enabled: true
  seed_url: https://faurecia.sharepoint.com/sites/ES-Asia_RandD2/Released Documents/CHD-F-DSE-1018
    BOM Conversion Tool.xlsm
central_management:
  central_root: ''
  startup_timeout_seconds: 5
contact:
  owner: Data Tool Support
  email: jing.pei@Forvia.com
  phone: +86-1522-173-4487
  note: 如程序报错，请截图并附上 Processing Log.txt 联系支持人员。
ui:
  brand_title: Testing Raw Data Consolidation
  accent_color: '#0A5E8E'
  highlight_color: '#E7F2F8'
  page_size: 200
lifecycle:
  auto_shutdown_on_idle: true
  idle_shutdown_seconds: 30
  idle_shutdown_poll_seconds: 2
  heartbeat_seconds: 3
  idle_shutdown_startup_grace_seconds: 120
  idle_shutdown_min_heartbeats: 3
template_folder_candidates:
- Raw data standard Title
scan:
  max_file_mb: 2048
  hash_chunk_kb: 1024
  duplicate_hash_head_mb: 4
merge:
  chunk_rows: 200000
  keep_source_row: true
export:
  merged_name: Merged Dataset.xlsx
  anomaly_name: Anomaly Report.xlsx
  validation_name: Validation Report.xlsx
  log_name: Processing Log.txt
  max_excel_rows: 1000000
  seconds_per_cell: 5.0e-06
  progress_chunk_rows: 20000
  chart_sheet_prefix: Trend_
  visible_excel_rows: 1048575
templates:
  selected_fill_rgb:
  - FFFFFF00
  - FF00B050
  max_header_scan_rows: 20
matching:
  aliases: {}
temperature:
  name_contains:
  - temp
  - temperature
  - tck
  - ts
  - thermocouple
  - egt
  - exhaust
  - 温度
  name_equals:
  - ts
  name_prefixes:
  - t burner
  - t gas
  - tc
  - egt
  numeric_prefixes:
  - t
  - ts
  - tck
  - tc
  - egt
  units:
  - c
  - degc
  - celsius
  - f
  - degf
  - k
  - kelvin
  group_prefix_min_columns: 5
test_types:
  FAKT:
    path_keywords:
    - fakt
    - lti-498
    extensions:
    - .txt
    fingerprints:
    - kind: first_line_contains
      value: Timestamp [ms];Runtime
    group: Burner
    time_basis: relative_ms
    parser: delimited
    axis_candidates:
    - Runtime [ms]
    - Timestamp [ms]
    - runtime
    - timestamp
    axis_output:
    - Runtime [ms]
  GANTER:
    path_keywords:
    - ganter
    extensions:
    - .csv
    fingerprints:
    - kind: first_line_contains
      value: TCK01
    group: Burner
    time_basis: absolute
    parser: delimited
    axis_candidates:
    - date
    - time
    - datetime
    - timestamp
    axis_output:
    - Date
    - Time
  SEOUL:
    path_keywords:
    - seoul
    extensions:
    - .csv
    fingerprints:
    - kind: line_contains
      line: 1
      value: T Burner
    group: Burner
    time_basis: absolute
    parser: delimited
    axis_candidates:
    - date
    - time
    - datetime
    - timestamp
    axis_output:
    - Date
    - Time
  T09:
    path_keywords:
    - t09
    - diesel burner
    - dfl
    extensions:
    - .xlsx
    - .tdms
    - .tdms_index
    fingerprints:
    - kind: sibling_ext
      value: .tdms
    - kind: magic
      value: TDMSm
    group: Burner
    time_basis: cycles
    parser: tabular
    axis_candidates:
    - cycles
    - cycle
    - cycle number
    axis_output:
    - Cycles
  T12:
    path_keywords:
    - t12
    extensions:
    - .a01
    - .a02
    - .a03
    - .a04
    - .a05
    - .a06
    - .a07
    - .a08
    - .a09
    - .files
    - .mlog
    - .xpar
    fingerprints:
    - kind: first_line_prefix
      value: BENCH4
    - kind: sibling_ext
      value: .files
    group: Engine bench
    time_basis: absolute
    parser: proprietary_t12
    axis_candidates:
    - date
    - time
    - datetime
    - timestamp
    axis_output:
    - Date
    - Time
  T13:
    path_keywords:
    - t13
    extensions:
    - .txt
    fingerprints:
    - kind: first_line_prefix
      value: MNTPFILE
    group: Engine bench
    time_basis: absolute
    parser: delimited
    axis_candidates:
    - date
    - time
    - datetime
    - timestamp
    axis_output:
    - Date
    - Time
  MP_SHAKER:
    path_keywords:
    - m+p
    - shake
    - shaker
    - hvt
    extensions:
    - .xlsx
    - .csv
    - .tsr
    - .rsr
    - .sot
    - .bin
    fingerprints:
    - kind: sibling_ext
      value: .tsr
    - kind: magic
      value: 005+
    group: HVT
    time_basis: relative_s
    parser: tabular
    axis_candidates:
    - X-Data [s]
    - x-data
    - time
    - frequency
    axis_output:
    - X-Data [s]
  OTHERS:
    path_keywords: []
    extensions: []
    fingerprints: []
    group: Others
    time_basis: unknown
    parser: unsupported
    axis_candidates: []
    axis_output: []
template_keywords:
  FAKT:
  - fakt
  GANTER:
  - ganter
  SEOUL:
  - seoul
  T09:
  - t09
  T12:
  - t12
  T13:
  - t13
  MP_SHAKER:
  - m+p
  - shaker
template_like_patterns:
- 表头
- template
- header
time_field_hints:
- timestamp
- date
- time
- x-data
cycle_field_hints:
- cycle
- cycles
anomaly_rules:
  limits:
    default: {}
  jump:
    enabled: true
    abs_factor: 10.0
    abs_min: null
    apply_to: colored_only
  temperature:
    enabled: true
    jump_pct: 0.1
    stable_window_points: 30
    stable_band_pct: 0.03
    drift_min_points: 20
    drift_delta_pct: 0.05
    monotonic_ratio: 0.7
    name_keywords:
    - temp
    - temperature
    - tck
    - egt
    - exhaust
    unit_keywords:
    - C
    - degC
    - °C
    - ℃
    - K
  data_quality:
    time_gap:
      enabled: true
      gap_factor: 5.0
      max_gaps_reported: 500
    constant_value:
      enabled: true
      min_seconds: 300
      min_points: 30
      ignore_values:
      - 0
    duplicates:
      enabled: true
    missing:
      enabled: true
      colored_nan_warn_ratio: 0.05
