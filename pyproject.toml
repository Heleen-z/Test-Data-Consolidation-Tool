[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-data-consolidation-tool"
version = "1.1.0"
description = "Local test data pre-check, consolidation and visualization tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3.1",
  "plotly>=5.24,<7",
  "pyarrow>=17,<25",
  "PyYAML>=6,<7",
  "streamlit>=1.41,<2",
  "xlsxwriter>=3.2,<4",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
testdata-tool = "testdata_tool.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testdata_tool = ["*.ps1", "bridge/*.bas", "bridge/*.xlsm", "bridge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
